services:
  - type: web
    name: northlijn-server
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # No Render-managed database here — Render's free Postgres tier
      # auto-deletes after 30 days, which isn't acceptable even for a
      # hobby project's real data. Use a free Neon (or Supabase) Postgres
      # instead and paste its connection string here manually in Render's
      # dashboard. `sync: false` means Render won't try to auto-fill this
      # and will prompt for it instead.
      - key: DATABASE_URL
        sync: false
      # Render generates and stores this itself — it's never typed or
      # displayed anywhere, including here.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
