databases:
  - name: northlijn-db
    plan: starter
    databaseName: northlijn
    user: northlijn

services:
  - type: web
    name: northlijn-server
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: northlijn-db
          property: connectionString
      # Render generates and stores this itself — it's never typed or
      # displayed anywhere, including here.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
